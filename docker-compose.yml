services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - radiocalico-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles: ["prod"]

  app-prod:
    build:
      context: .
      target: prod
    image: radiocalico:prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    restart: unless-stopped
    profiles: ["prod"]

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: radiocalico-nginx:prod
    ports:
      - "80:80"
    depends_on:
      - app-prod
    restart: unless-stopped
    profiles: ["prod"]

  app-dev:
    build:
      context: .
      target: dev
    image: radiocalico:dev
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - radiocalico-dev-data:/app/data
    profiles: ["dev"]

volumes:
  radiocalico-pgdata:
  radiocalico-dev-data:
